# Homelab - core services (Phase 1) + own app (Phase 2)
# Start:  docker compose up -d     Stop: docker compose down
# Logs:   docker compose logs -f <service>

services:
  # Web UI for managing Docker containers, images, volumes and networks
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"            # https://localhost:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets Portainer control Docker
      - portainer_data:/data

  # Uptime monitoring: checks your services and alerts when one goes down
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"            # http://localhost:3001
    volumes:
      - uptime_kuma_data:/app/data

  # Dashboard with links to every service
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"            # http://localhost:3000
    environment:
      HOMEPAGE_ALLOWED_HOSTS: localhost:3000,127.0.0.1:3000,homepage:3000  # homepage:3000 = calls from other containers (Uptime Kuma)
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro  # read-only: shows container status

  # ---- Phase 2: own app (built and published by GitHub Actions) ----

  # PostgreSQL database for the Tasks API (not exposed to the host, only to tasks-api)
  tasks-db:
    image: postgres:16-alpine
    container_name: tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${TASKS_DB_PASSWORD:?set TASKS_DB_PASSWORD in .env}
    volumes:
      - tasks_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI REST API. `docker compose pull tasks-api` gets the latest image from CI;
  # `docker compose build tasks-api` builds it locally from ./app instead.
  tasks-api:
    image: ghcr.io/htet-myark/homelab-tasks-api:latest
    build: ./app
    container_name: tasks-api
    restart: unless-stopped
    ports:
      - "8000:8000"            # http://localhost:8000/docs
    environment:
      DATABASE_URL: postgresql+psycopg://tasks:${TASKS_DB_PASSWORD}@tasks-db:5432/tasks
    depends_on:
      tasks-db:
        condition: service_healthy   # wait until Postgres accepts connections

volumes:
  portainer_data:
  uptime_kuma_data:
  tasks_db_data:
