# CI/CD for the Tasks API
#   Every push / pull request:  lint -> test -> build Docker image
#   Push to main only:          also push the image to GitHub Container Registry (ghcr.io)
name: tasks-api CI/CD

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/tasks-api.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/tasks-api.yml"]
  workflow_dispatch: {}  # allows a manual run from the Actions tab

env:
  IMAGE: ghcr.io/htet-myark/homelab-tasks-api  # registry names must be lowercase

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (pytest)
        run: pytest -v

  build-and-push:
    needs: test  # only runs if tests passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # built-in, no secret to set up

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: ${{ github.event_name != 'pull_request' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
